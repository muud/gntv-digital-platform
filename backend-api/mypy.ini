[mypy]
python_version = 3.12
strict = True
exclude = (?x)(
    ^venv/
    | ^\.venv/
    | ^services/
    | ^utils/
    | ^models\.py$
    | ^database\.py$
    | ^main\.py$
    | ^auth\.py$
    | ^migrations\.py$
    | ^router\.py$
    | ^websocket_manager\.py$
    | ^verify_backend\.py$
    | ^app/utils/auth_dependencies\.py$
    | ^app/core/security\.py$
    | ^alembic/versions/
  )
# Global strict settings
# We will ignore missing imports for third‑party libraries that lack stubs
[mypy-redis]
ignore_missing_imports = True
[mypy-jose]
ignore_missing_imports = True
[mypy-uvicorn]
ignore_missing_imports = True
[mypy-fastapi]
ignore_missing_imports = True
[mypy-pydantic]
ignore_missing_imports = True
[mypy-aiosmtplib]
ignore_missing_imports = True
